<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870"><rect width="600" height="870" rx="16" fill="#16213d"/><g font-family="sans-serif" fill="#fff9ec"><text x="30" y="48" font-size="27" font-weight="bold">POPONDI / TOLINDO</text><text x="30" y="80" font-size="17" fill="#99f1f8">EXPLODED VIEW / SKEMA KONSEPTUAL</text><path d="M140 120 V760" stroke="#99f1f8" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(0 170)"><path d="M105 45 L175 -45" stroke="#86cbd0" stroke-width="4"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">1. Dawai</text><text x="270" y="16" font-size="17">Sumber getaran melalui </text><text x="270" y="42" font-size="17">petikan. </text></g><g transform="translate(0 350)"><path d="M110 50 Q50 -20 120 -65 Q145 -80 175 -45" fill="none" stroke="#a47749" stroke-width="12"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">2. Penopang lengkung</text><text x="270" y="16" font-size="17">Struktur penegang dawai </text><text x="270" y="42" font-size="17">konseptual. </text></g><g transform="translate(0 530)"><path d="M75 -15 Q140 75 205 -15Z" fill="#a47749"/><ellipse cx="140" cy="-15" rx="65" ry="20" fill="#16213d"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">3. Resonator</text><text x="270" y="16" font-size="17">Badan berbentuk mangkuk </text><text x="270" y="42" font-size="17">dalam skema. </text></g><g transform="translate(0 710)"><rect x="110" y="-12" width="60" height="24" rx="8" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">4. Penghubung</text><text x="270" y="16" font-size="17">Jalur getaran menuju </text><text x="270" y="42" font-size="17">resonator. </text></g><text x="30" y="830" font-size="16">Bentuk, bahan, dan proporsi perlu verifikasi artefak.</text></g></svg>