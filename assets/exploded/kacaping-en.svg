<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870"><rect width="600" height="870" rx="16" fill="#16213d"/><g font-family="sans-serif" fill="#fff9ec"><text x="30" y="48" font-size="27" font-weight="bold">KACAPING</text><text x="30" y="80" font-size="17" fill="#99f1f8">EXPLODED VIEW / CONCEPTUAL MODEL</text><path d="M140 120 V760" stroke="#99f1f8" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(0 170)"><g stroke="#86cbd0" stroke-width="4"><path d="M125 -50 v100 M155 -50 v100"/></g><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">1. Strings</text><text x="270" y="16" font-size="16">The source of vibration when</text><text x="270" y="42" font-size="16">plucked.</text></g><g transform="translate(0 350)"><rect x="110" y="-10" width="60" height="20" rx="3" fill="#a47749"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">2. Bridge</text><text x="270" y="16" font-size="16">Transfers string vibration</text><text x="270" y="42" font-size="16">to the body.</text></g><g transform="translate(0 530)"><ellipse cx="140" cy="0" rx="60" ry="65" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">3. Soundboard</text><text x="270" y="16" font-size="16">The surface of the</text><text x="270" y="42" font-size="16">conceptual resonator.</text></g><g transform="translate(0 710)"><path d="M90 -50 Q140 -95 190 -50 L180 50 Q140 85 100 50Z" fill="#a47749"/><ellipse cx="140" cy="-40" rx="36" ry="12" fill="#16213d"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">4. Wooden body</text><text x="270" y="16" font-size="16">A cavity that illustrates</text><text x="270" y="42" font-size="16">the relationship between</text><text x="270" y="68" font-size="16">shape and sound.</text></g><text x="30" y="830" font-size="16">Form, materials and proportions require artefact verification.</text></g></svg>