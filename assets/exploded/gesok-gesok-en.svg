<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870"><rect width="600" height="870" rx="16" fill="#16213d"/><g font-family="sans-serif" fill="#fff9ec"><text x="30" y="48" font-size="27" font-weight="bold">GESOK-GESOK</text><text x="30" y="80" font-size="17" fill="#99f1f8">EXPLODED VIEW / CONCEPTUAL MODEL</text><path d="M140 120 V760" stroke="#99f1f8" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(0 170)"><g stroke="#86cbd0" stroke-width="4"><path d="M130 -50 v100 M150 -50 v100"/></g><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">1. Strings</text><text x="270" y="16" font-size="16">Vibrate through friction</text><text x="270" y="42" font-size="16">from the bow.</text></g><g transform="translate(0 350)"><rect x="125" y="-60" width="30" height="120" rx="8" fill="#a47749"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">2. Neck</text><text x="270" y="16" font-size="16">Supports the strings in the</text><text x="270" y="42" font-size="16">model.</text></g><g transform="translate(0 530)"><ellipse cx="140" cy="0" rx="65" ry="50" fill="#a47749"/><ellipse cx="140" cy="-10" rx="55" ry="35" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">3. Resonator</text><text x="270" y="16" font-size="16">Helps make string vibrations</text><text x="270" y="42" font-size="16">audible.</text></g><g transform="translate(0 710)"><path d="M170 -55 Q210 0 170 55" fill="none" stroke="#a47749" stroke-width="8"/><path d="M160 -55 v110" stroke="#86cbd0" stroke-width="3"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">4. Bow</text><text x="270" y="16" font-size="16">Friction sustains string</text><text x="270" y="42" font-size="16">vibration.</text></g><text x="30" y="830" font-size="16">Form, materials and proportions require artefact verification.</text></g></svg>