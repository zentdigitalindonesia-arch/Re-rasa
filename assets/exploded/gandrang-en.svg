<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870"><rect width="600" height="870" rx="16" fill="#16213d"/><g font-family="sans-serif" fill="#fff9ec"><text x="30" y="48" font-size="27" font-weight="bold">GANDRANG</text><text x="30" y="80" font-size="17" fill="#99f1f8">EXPLODED VIEW / CONCEPTUAL MODEL</text><path d="M140 120 V760" stroke="#99f1f8" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(0 170)"><ellipse cx="140" cy="0" rx="85" ry="20" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">1. Upper membrane</text><text x="270" y="16" font-size="16">The surface vibrates when</text><text x="270" y="42" font-size="16">struck.</text></g><g transform="translate(0 350)"><path d="M65 -55 Q140 -90 215 -55 L200 55 Q140 82 80 55Z" fill="#a47749"/><ellipse cx="140" cy="-55" rx="75" ry="18" fill="#16213d"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">2. Hollow body</text><text x="270" y="16" font-size="16">The cavity helps shape</text><text x="270" y="42" font-size="16">resonance.</text></g><g transform="translate(0 530)"><g stroke="#86cbd0" stroke-width="5"><path d="M75 -45 l10 90"/><path d="M95 -45 l10 90"/><path d="M115 -45 l10 90"/><path d="M135 -45 l10 90"/><path d="M155 -45 l10 90"/><path d="M175 -45 l10 90"/><path d="M195 -45 l10 90"/></g><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">3. Tension cords</text><text x="270" y="16" font-size="16">Hold the membranes and</text><text x="270" y="42" font-size="16">regulate their tension in</text><text x="270" y="68" font-size="16">this model.</text></g><g transform="translate(0 710)"><ellipse cx="140" cy="0" rx="72" ry="19" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="20" font-weight="bold">4. Lower membrane</text><text x="270" y="16" font-size="16">A second vibrating surface</text><text x="270" y="42" font-size="16">in this conceptual model.</text></g><text x="30" y="830" font-size="16">Form, materials and proportions require artefact verification.</text></g></svg>