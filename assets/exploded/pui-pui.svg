<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 870"><rect width="600" height="870" rx="16" fill="#16213d"/><g font-family="sans-serif" fill="#fff9ec"><text x="30" y="48" font-size="27" font-weight="bold">PUI-PUI</text><text x="30" y="80" font-size="17" fill="#99f1f8">EXPLODED VIEW / SKEMA KONSEPTUAL</text><path d="M140 120 V760" stroke="#99f1f8" stroke-width="2" stroke-dasharray="8 8"/><g transform="translate(0 170)"><path d="M125 25 L132 -40 H148 L155 25Z" fill="#e5d8b8"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">1. Bagian peniup</text><text x="270" y="16" font-size="17">Tempat masuk napas; bentuk </text><text x="270" y="42" font-size="17">lidah disederhanakan. </text></g><g transform="translate(0 350)"><rect x="115" y="-60" width="50" height="120" rx="8" fill="#a47749"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">2. Badan saluran</text><text x="270" y="16" font-size="17">Ruang aliran udara pada </text><text x="270" y="42" font-size="17">model. </text></g><g transform="translate(0 530)"><g fill="#86cbd0"><circle cx="140" cy="-45" r="7"/><circle cx="140" cy="-23" r="7"/><circle cx="140" cy="-1" r="7"/><circle cx="140" cy="21" r="7"/><circle cx="140" cy="43" r="7"/></g><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">3. Lubang nada</text><text x="270" y="16" font-size="17">Bukaan yang ditampilkan </text><text x="270" y="42" font-size="17">secara konseptual. </text></g><g transform="translate(0 710)"><path d="M120 -40 H160 L195 40 Q140 65 85 40Z" fill="#a47749"/><path d="M220 0 H260" stroke="#99f1f8"/><text x="270" y="-15" font-size="21" font-weight="bold">4. Corong ujung</text><text x="270" y="16" font-size="17">Bagian keluaran pada model </text><text x="270" y="42" font-size="17">prototipe. </text></g><text x="30" y="830" font-size="16">Bentuk, bahan, dan proporsi perlu verifikasi artefak.</text></g></svg>